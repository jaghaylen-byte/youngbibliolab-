<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتبة صغار الباحثين | Young Researchers' Library</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
</head>
<body>
<div dir="rtl" lang="ar">
<header class="mast">
  <div class="wrap">
    <div class="mast-row">
      <div class="brand">
        <h1>مكتبة صغار الباحثين</h1>
        <small>Young Researchers' Human Rights Library</small>
      </div>
      <label class="search" for="q">
        <input id="q" type="search" placeholder="ابحث في المكتبة والوثائق..." autocomplete="off">
      </label>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="home" aria-selected="true">الرئيسية</button>
      <button class="tab" role="tab" data-v="reports">الأبحاث والتقارير حول تونس</button>
      <button class="tab" role="tab" data-v="library">أقسام المكتبة</button>
      <button class="tab" role="tab" data-v="rights">دليل الحقوق والحريات</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite">
    <!-- المحتوى يتم تحميله عبر JS -->
</main>
<footer class="wrap">
  <p>الروابط تحيل إلى المصادر الأصلية. الأولوية للمعلومة القانونية الدقيقة.</p>
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
